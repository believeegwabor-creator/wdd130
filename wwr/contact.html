<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact White Water Rafting for reservations, questions, trip information, and website suggestions.">
    <meta name="author" content="Believe Egwabor">
    <title>Contact Us | White Water Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.jpg" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="contact-info">
            <h1>White Water Rafting Contact Us</h1>

            <p><strong>Address:</strong> 123 River Road, Rapids City, Idaho</p>
            <p><strong>Phone:</strong> (208) 555-1234</p>
            <p><strong>Email:</strong> info@whitewaterrafting.com</p>

            <iframe src="https://www.google.com/maps/embed?pb=" loading="lazy">
            </iframe>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee1.jpg" alt="John Smith General Manager">
                <figcaption>John Smith - General Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Sarah Jones Trip Coordinator">
                <figcaption>Sarah Jones - Trip Coordinator</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Mike Brown River Guide">
                <figcaption>Mike Brown - River Guide</figcaption>
            </figure>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form method="post">

                <label for="fullname">Name:</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Message</legend>

                    <input type="radio" id="general" name="purpose" value="general" required>
                    <label for="general">General Inquiry</label>

                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>

                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    <label for="suggestion">Website Suggestion</label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>

            </form>
        </section>

    </main>

    <>
        <footer>
            <p>&copy; 2026 White Water Rafting | Believe Egwabor</p>

            <nav class="socialmedia">
                <a href="https://facebook.com">
                    <img src="images/facebook.png" alt="Facebook">
                </a>

                <a href="https://instagram.com">
                    <img src="images/instagram.png" alt="Instagram">
                </a>

                <a href="https://linkedin.com">
                    <img src="images/linkedin.png" alt="LinkedIn">
                </a>
            </nav>
        </footer>


</body>

</html>
